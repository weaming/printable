[project]
name = "printable"
version = "0.4.4"
description = "CLI and functions help for printing tabular data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "wcwidth>=0.2.13",
]

[project.scripts]
printable = "printable:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["printable"]
# 已编译的 native 库（printable/native/lib/<平台>/libcolumn.* 存在时打入 wheel）
include = ["printable/native/lib/**/*.dylib", "printable/native/lib/**/*.so"]

[tool.hatch.build.targets.sdist]
# 排除 submodule 与构建产物（util-linux 含外部绝对符号链接，uv 解包会拒绝）
exclude = ["build/**", "util-linux/**"]

[tool.uv]
package = true
